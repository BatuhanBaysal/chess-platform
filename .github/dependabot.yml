version: 2
updates:
    - package-ecosystem: "maven"
      directory: "/chess-backend"
      schedule:
          interval: "monthly"
      open-pull-requests-limit: 10

    - package-ecosystem: "npm"
      directory: "/chess-frontend"
      schedule:
          interval: "monthly"
      open-pull-requests-limit: 10
      ignore:
          - dependency-name: "*"
