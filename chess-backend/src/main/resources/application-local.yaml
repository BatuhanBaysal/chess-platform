server:
    port: 8080

spring:
    datasource:
        url: ${CHESS_DB_URL}
        username: ${CHESS_DB_USERNAME}
        password: ${CHESS_DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    liquibase:
        enabled: true

    data:
        redis:
            host: localhost
            port: 6379

management:
    tracing:
        enabled: false

chess:
    security:
        jwt:
            secret-key: ${CHESS_JWT_SECRET}
            expiration: ${CHESS_JWT_EXPIRATION}
