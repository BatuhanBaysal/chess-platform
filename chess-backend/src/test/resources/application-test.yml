spring:
    application:
        name: chess-backend-test

    datasource:
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml
        enabled: true
        default-schema: public

    cache:
        type: none

    redisson:
        enabled: false

    data:
        redis:
            repositories:
                enabled: false

    autoconfigure:
        exclude:
            - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
            - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
            - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
            - org.redisson.spring.starter.RedissonAutoConfigurationV2

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8081/realms/chess-realm
                    jwk-set-uri: http://localhost:8081/realms/chess-realm/protocol/openid-connect/certs

keycloak:
    guest-client-id: chess-guest-client
    guest-client-secret: ""
    server-url: http://localhost:8081
    token-uri: http://localhost:8081/realms/chess-realm/protocol/openid-connect/token
    admin-username: admin
    admin-password: admin

management:
    health:
        redis:
            enabled: false
    endpoints:
        web:
            exposure:
                include: health
    otlp:
        tracing:
            endpoint: http://localhost:4318
    tracing:
        enabled: false

ADMIN_USERNAME: ${ADMIN_USERNAME:admin}
ADMIN_EMAIL: ${ADMIN_EMAIL:admin@chess.com}
ADMIN_PASSWORD: ${ADMIN_PASSWORD:Admin123!}
