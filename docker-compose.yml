services:
    db:
        image: postgres:15-alpine
        profiles: [ "core" ]
        container_name: chess-postgres
        restart: always
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: chess_db
            POSTGRES_USER: ${CHESS_DB_USERNAME}
            POSTGRES_PASSWORD: ${CHESS_DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - chess-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${CHESS_DB_USERNAME} -d chess_db"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        profiles: ["core"]
        container_name: chess-redis
        restart: always
        ports:
            - "6379:6379"
        networks:
            - chess-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build: ./chess-backend
        profiles: [ "core" ]
        container_name: chess-server
        restart: always
        env_file:
            - .env
        ports:
            - "8080:8080"
        volumes:
            - ./logs:/app/logs
        networks:
            - chess-network
        environment:
            CHESS_DB_URL: jdbc:postgresql://db:5432/chess_db
            CHESS_DB_USERNAME: ${CHESS_DB_USERNAME}
            CHESS_DB_PASSWORD: ${CHESS_DB_PASSWORD}
            CHESS_REDIS_HOST: redis
            CHESS_REDIS_PORT: 6379
            CHESS_JWT_SECRET: ${CHESS_JWT_SECRET}
            CHESS_JWT_EXPIRATION: ${CHESS_JWT_EXPIRATION}
            ADMIN_USERNAME: ${ADMIN_USERNAME}
            ADMIN_EMAIL: ${ADMIN_EMAIL}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD}
            AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://minio:9000}
            AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
            AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-minioadmin}
            AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY:-minioadmin}
            AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-chess-storage}
            SPRING_LIQUIBASE_ENABLED: "true"
            MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
            MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
            LOGGING_FILE_NAME: /app/logs/chess-backend.log
            KEYCLOAK_SERVER_URL: http://keycloak:8081
            KEYCLOAK_TOKEN_URI: http://keycloak:8081/realms/chess-realm/protocol/openid-connect/token
            KEYCLOAK_ISSUER_URI: http://keycloak:8081/realms/chess-realm
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8081/realms/chess-realm/protocol/openid-connect/certs
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            keycloak:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 40s

    frontend:
        build: ./chess-frontend
        profiles: [ "core" ]
        container_name: chess-ui
        restart: always
        ports:
            - "${FRONTEND_PORT:-8082}:80"
        networks:
            - chess-network
        environment:
            - VITE_API_URL=http://localhost:8080
        depends_on:
            backend:
                condition: service_healthy

    # --- OBSERVABILITY (LGTM STACK) ---
    prometheus:
        image: prom/prometheus:latest
        profiles: ["monitoring"]
        container_name: chess-prometheus
        restart: unless-stopped
        volumes:
            - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
        ports:
            - "9090:9090"
        networks:
            - chess-network
        depends_on:
            - backend

    loki:
        image: grafana/loki:latest
        profiles: ["monitoring"]
        container_name: chess-loki
        ports:
            - "3100:3100"
        networks:
            - chess-network
        volumes:
            - ./deploy/monitoring/loki-config.yml:/etc/loki/config.yml
        command: -config.file=/etc/loki/config.yml
        restart: unless-stopped

    tempo:
        image: grafana/tempo:latest
        profiles: ["monitoring"]
        container_name: chess-tempo
        networks:
            - chess-network
        command: [ "-config.file=/etc/tempo.yaml" ]
        volumes:
            - ./deploy/monitoring/tempo.yml:/etc/tempo.yaml
        ports:
            - "3200:3200"
            - "4317:4317"
            - "4318:4318"
        restart: unless-stopped

    promtail:
        image: grafana/promtail:latest
        profiles: ["monitoring"]
        container_name: chess-promtail
        restart: unless-stopped
        networks:
            - chess-network
        volumes:
            - ./logs:/var/log
            - ./deploy/monitoring/promtail-config.yml:/etc/promtail/config.yml
        command: -config.file=/etc/promtail/config.yml
        depends_on:
            - loki

    grafana:
        image: grafana/grafana:latest
        profiles: ["monitoring"]
        container_name: chess-grafana
        restart: unless-stopped
        ports:
            - "3000:3000"
        networks:
            - chess-network
        volumes:
            - grafana_data:/var/lib/grafana
            - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning
            - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
        depends_on:
            - prometheus
            - loki
            - tempo

    # --- OBJECT STORAGE (MINIO - LOCAL ONLY) ---
    minio:
        image: quay.io/minio/minio:latest
        profiles: [ "storage-local" ]
        container_name: chess-minio
        restart: always
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        networks:
            - chess-network
        healthcheck:
            test: [ "CMD-SHELL", "mc ready local || exit 0" ]
            interval: 5s
            timeout: 5s
            retries: 5

    keycloak:
        image: quay.io/keycloak/keycloak:24.0.1
        profiles: [ "core", "iam" ]
        container_name: chess-keycloak
        restart: always
        env_file:
            - .env
        command: start-dev --import-realm
        environment:
            KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
            KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://db:5432/chess_db
            KC_DB_USERNAME: ${CHESS_DB_USERNAME}
            KC_DB_PASSWORD: ${CHESS_DB_PASSWORD}
            KC_DB_SCHEMA: keycloak
            KC_HTTP_PORT: 8081
            KC_HEALTH_ENABLED: "true"
            JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx384m"
        deploy:
            resources:
                limits:
                    memory: 512m
        ports:
            - "${KEYCLOAK_PORT:-8081}:8081"
        networks:
            - chess-network
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.1 200 OK' <&3" ]
            interval: 10s
            timeout: 5s
            retries: 15
            start_period: 30s

networks:
    chess-network:
        driver: bridge

volumes:
    postgres_data:
    prometheus_data:
    grafana_data:
    minio_data:
